fence-language:
  source: docs-lint/scripts/lint.py
  functions: [check_fences, is_request]
  boundaries: [empty-tag, canonical-tag, unknown-tag, alias-case-and-info, shell-non-request]
filler:
  source: docs-lint/scripts/lint.py
  functions: [check_filler, _exempt]
  boundaries: [exception-phrases, word-boundaries, code-exclusion, replacement-and-deletion, leverage-noun-verb, each-new-phrase]
reference-no-shell:
  source: docs-lint/scripts/lint.py
  functions: [check_fences, is_request]
  boundaries: [code-tab-label, shell-non-request, guide-scope]
callout-emoji:
  source: docs-lint/scripts/lint.py
  functions: [check_callouts]
  boundaries: [theme-mismatch, missing-theme, missing-icon, attribute-order-quotes-selectors, code-exclusion]
link-absolute-internal:
  source: docs-lint/scripts/lint.py
  functions: [check_links]
  boundaries: [cross-project, relative-path, ref-prefix, index-fragment, platform-guide-vs-reference, ledgers-project]
em-dash:
  source: docs-lint/scripts/lint.py
  functions: [check_em_dash]
  boundaries: [code-vs-prose, tables, multiline]
image-alt:
  targets:
  - source: docs-lint/scripts/lint.py
    functions: [check_images]
  - source: docs-review/scripts/contexts.py
    functions: [includes, file_context]
  boundaries: [empty-vs-missing, untouched, touched-multiline, new-file, no-base]
body-h1:
  targets:
  - source: docs-lint/scripts/lint.py
    functions: [check_body_heading]
  - source: docs-review/scripts/contexts.py
    functions: [includes, file_context]
  boundaries: [existing-review, new-file, no-base, empty-heading]
openapi-field-exists:
  source: docs-test/scripts/apicheck.py
  functions: [check_fields]
  boundaries: [enum-value, metadata, nested-arrays, escaped-pointer, non-mt, curl-data, composition-ref]
reuse-undefined-block:
  source: docs-maintain/scripts/maintain.py
  functions: [check_reuse]
  boundaries: [built-in, defined, escaped, code, component-attributes]
leak-names:
  source: docs-lint/scripts/lint.py
  functions: [check_names]
  boundaries: [case-insensitive, whole-word, comments, review-inactive, no-list, empty-list, first-newline]
leak-internal:
  source: docs-lint/scripts/lint.py
  functions: [check_internal]
  boundaries: [slack-url, gong-url, issue-prefix, standards, salesforce-context, salesforce-length, first-newline]
